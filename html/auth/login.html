<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/output.css" />
    <title>Login - CariKOL</title>
  </head>
  <body
    class="flex items-center justify-center min-h-screen bg-left-bottom bg-no-repeat bg-cover"
    style="background-image: url('/assets/images/login2.png');"
  >
    <div class="flex items-center justify-center w-full min-h-screen">
      <div class="flex flex-col items-center w-full max-w-4xl mx-auto md:flex-row md:gap-16">
        <!-- Hero Section (hidden on mobile) -->
        <div class="flex-col justify-center flex-1 hidden md:flex">
          <a href="/html"
             class="flex items-center gap-2 mb-4 transition group hover:opacity-80">
            <img src="/assets/images/logo.png" alt="CariKOL" class="w-7 h-7 lg:w-8 lg:h-8" />
            <span class="text-xl font-bold text-teal-600 lg:text-2xl">CariKOL</span>
          </a>
          <h1 class="mb-3 text-3xl font-black text-gray-900 lg:text-4xl xl:text-5xl">Welcome Back</h1>
          <p class="mb-4 text-base text-gray-700 lg:text-lg xl:text-xl">
            Join with us to get future Kol Access Member
          </p>
          <p class="text-sm text-gray-600 lg:text-base xl:text-lg">
            We provide to get a Kol with various feature without difficult access and also make end to end access.
          </p>
        </div>
        <!-- Login Form -->
        <div class="flex justify-center flex-1 w-full">
          <div class="w-11/12 max-w-md p-6 bg-white border border-gray-300 shadow-2xl md:p-8 rounded-2xl backdrop-blur-md"
               style="box-shadow: 0 8px 32px 0 rgba(0,0,0,0.18);">
            <div class="mb-8 text-center">
              <h2 class="mb-2 text-2xl font-bold text-teal-600">Login</h2>
              <p class="text-sm text-gray-600">Let's get started to join with us</p>
            </div>
            <form>
              <div class="mb-5">
                <input
                  type="email"
                  placeholder="Email"
                  class="w-full px-4 py-3 text-gray-900 placeholder-gray-400 transition border border-gray-300 rounded-lg focus:border-teal-600 focus:ring-2 focus:ring-teal-100 bg-gray-50"
                  required
                />
              </div>
              <div class="relative mb-5" x-data="{ show: false }">
                <input
                  :type="show ? 'text' : 'password'"
                  placeholder="Password"
                  class="w-full px-4 py-3 text-gray-900 placeholder-gray-400 transition border border-gray-300 rounded-lg focus:border-teal-600 focus:ring-2 focus:ring-teal-100 bg-gray-50"
                  required
                />
                <button
                  type="button"
                  class="absolute inset-y-0 flex items-center text-teal-600 right-3"
                  @click="show = !show"
                  tabindex="-1"
                  :aria-label="show ? 'Hide password' : 'Show password'"
                >
                  <svg x-show="!show" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12z" />
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" fill="none"/>
                  </svg>
                  <svg x-show="show" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M9.88 9.88A3 3 0 0112 9c1.657 0 3 1.343 3 3 0 .512-.13.995-.36 1.41M6.53 6.53C4.06 8.36 2.25 12 2.25 12s3.75 7.5 9.75 7.5c2.09 0 4.01-.41 5.66-1.12M17.47 17.47C19.94 15.64 21.75 12 21.75 12s-3.75-7.5-9.75-7.5c-.98 0-1.93.09-2.83.26" />
                  </svg>
                </button>
              </div>
              <div class="flex justify-end mb-6">
                <a href="#" class="text-sm text-teal-600 hover:underline">Forgot your password?</a>
              </div>
              <button
                type="submit"
                class="w-full py-3 font-semibold text-white transition bg-teal-600 rounded-lg hover:bg-teal-700"
              >
                Next
              </button>
            </form>
            <div class="mt-8 text-center">
              <span class="text-sm text-gray-600">Don't have an account?</span>
              <a href="/html/auth/register.html" class="ml-1 font-semibold text-teal-600 hover:underline">Sign Up</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.js"></script>
  </body>
</html>
